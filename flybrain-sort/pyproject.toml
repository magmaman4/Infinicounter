[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flybrain-sort"
version = "0.1.0"
description = "A sorting algorithm whose every comparison is decided by a simulation of the complete fruit fly brain connectome"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8", "pandas>=1.4", "pyarrow>=8"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
flybrain-sort = "flybrain_sort.__main__:main"

[tool.setuptools]
packages = ["flybrain_sort"]
